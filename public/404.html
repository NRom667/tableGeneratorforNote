<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#137c50" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ページが見つかりません｜note表メーカー</title>
    <style>
      :root {
        color: #202723;
        background: #f5f7f4;
        font-family: Inter, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --green: #137c50;
        --green-dark: #0d5e3b;
        --green-pale: #e7f2ec;
        --ink: #202723;
        --muted: #68716b;
        --line: #dce2dd;
        --page-gutter: clamp(20px, 5vw, 76px);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        display: grid;
        grid-template-rows: 72px 1fr;
        background:
          linear-gradient(rgba(19, 124, 80, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(19, 124, 80, 0.025) 1px, transparent 1px),
          #f5f7f4;
        background-size: 32px 32px;
      }

      a {
        -webkit-tap-highlight-color: transparent;
      }

      a:focus-visible {
        outline: 3px solid rgba(19, 124, 80, 0.24);
        outline-offset: 3px;
      }

      header {
        padding: 0 var(--page-gutter);
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgba(220, 226, 221, 0.85);
        background: rgba(245, 247, 244, 0.9);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: var(--ink);
        text-decoration: none;
        font-size: 16px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .brand-mark {
        width: 25px;
        height: 25px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
      }

      .brand-mark i {
        display: block;
        border-radius: 1px;
        background: var(--green);
      }

      main {
        width: min(1180px, calc(100% - var(--page-gutter) * 2));
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: clamp(48px, 10vw, 150px);
        padding: clamp(56px, 10vh, 120px) 0;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.17em;
      }

      .eyebrow::before {
        width: 26px;
        height: 2px;
        background: var(--green);
        content: "";
      }

      h1 {
        max-width: 760px;
        margin: 20px 0 23px;
        font-size: clamp(46px, 7vw, 92px);
        line-height: 1.04;
        letter-spacing: -0.07em;
      }

      p {
        max-width: 520px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(14px, 1.3vw, 17px);
        line-height: 1.9;
      }

      .home-link {
        min-height: 52px;
        margin-top: 37px;
        display: inline-flex;
        align-items: center;
        gap: 13px;
        padding: 0 24px;
        border-radius: 4px;
        background: var(--green);
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 750;
        transition: background 160ms ease, transform 160ms ease;
      }

      .home-link::after {
        content: "→";
        font-size: 18px;
        transition: transform 160ms ease;
      }

      .home-link:hover {
        background: var(--green-dark);
        transform: translateY(-1px);
      }

      .home-link:hover::after {
        transform: translateX(3px);
      }

      .error-number {
        position: relative;
        color: var(--green-pale);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(112px, 20vw, 260px);
        font-weight: 800;
        letter-spacing: -0.12em;
        line-height: 0.8;
        user-select: none;
      }

      .error-number::after {
        position: absolute;
        right: -4%;
        bottom: -25%;
        width: 42%;
        aspect-ratio: 1;
        border: 1px solid rgba(19, 124, 80, 0.24);
        content: "";
        background:
          linear-gradient(90deg, transparent 49%, rgba(19, 124, 80, 0.24) 50%, transparent 51%),
          linear-gradient(transparent 49%, rgba(19, 124, 80, 0.24) 50%, transparent 51%);
      }

      @keyframes rise-in {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .message {
        animation: rise-in 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .error-number {
        animation: rise-in 600ms 100ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @media (max-width: 720px) {
        body {
          grid-template-rows: 62px 1fr;
        }

        main {
          grid-template-columns: 1fr;
          align-content: center;
          gap: 58px;
        }

        .error-number {
          grid-row: 1;
          justify-self: start;
          font-size: clamp(100px, 38vw, 160px);
        }

        .message {
          grid-row: 2;
        }

        .error-number::after {
          bottom: -18%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="note表メーカー トップへ戻る">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
        <span>note表メーカー</span>
      </a>
    </header>

    <main>
      <section class="message" aria-labelledby="error-title">
        <div class="eyebrow">PAGE NOT FOUND</div>
        <h1 id="error-title">ページが<br />見つかりません。</h1>
        <p>URLが間違っているか、ページが移動・削除された可能性があります。</p>
        <a class="home-link" href="/">トップページへ戻る</a>
      </section>
      <div class="error-number" aria-hidden="true">404</div>
    </main>
  </body>
</html>
